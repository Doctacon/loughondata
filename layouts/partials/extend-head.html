{{ with resources.Get "css/field-log.css" }}<style>{{ . | minify }}</style>{{ end }}
{{ with resources.Get "img/scenery.png" }}<style>:root { --butte-granite: url("{{ .RelPermalink }}"); }</style>{{ end }}
{{ with resources.Get "img/acorn-woodpecker-sprite.png" }}<style>:root { --acorn-woodpecker-sprite: url("{{ .RelPermalink }}"); }</style>{{ end }}
{{ with resources.Get "img/acorn-woodpecker-flight.png" }}<style>:root { --acorn-woodpecker-flight: url("{{ .RelPermalink }}"); }</style>{{ end }}
<script>
  (function () {
    const root = document.documentElement;

    try {
      root.classList.toggle("dark", localStorage.getItem("appearance") !== "light");
    } catch {
      root.classList.add("dark");
    }

    const setScrolled = () => {
      root.dataset.scrolled = window.scrollY > 20 ? "true" : "false";
    };
    setScrolled();
    window.addEventListener("scroll", setScrolled, { passive: true });

    window.addEventListener("DOMContentLoaded", () => {
      root.classList.add("js");

      const woodpeckerGutters = document.querySelector(".woodpecker-gutters");
      const woodpeckerGlass = document.querySelector(".woodpecker-glass");
      const woodpeckerPerch = document.querySelector(".woodpecker-perch");
      if (woodpeckerGutters && woodpeckerGlass && woodpeckerPerch) {
        // Decorative layers sit outside the body glass so they remain fixed to the landscape.
        document.documentElement.append(woodpeckerGutters, woodpeckerGlass, woodpeckerPerch);

        const flightBird = woodpeckerGutters.querySelector(".woodpecker--flight");
        const glassBird = woodpeckerGlass.querySelector(".woodpecker");
        const reduceWoodpeckerMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const isHome = woodpeckerGutters.dataset.home === "true";
        const flightFrames = [0, 1, 2, 3, 4];
        const scenery = { width: 1672, height: 941, trunkX: 157, trunkY: 362, birdSize: 114 };
        let flightComplete = reduceWoodpeckerMotion || !isHome;

        const layoutGutters = () => {
          const runner = document.body.getBoundingClientRect();
          const leftWidth = Math.max(0, runner.left);
          const rightWidth = Math.max(0, window.innerWidth - runner.right);
          const eligible = window.innerWidth >= 1024 && leftWidth >= 160 && rightWidth >= 160;
          for (const layer of [woodpeckerGutters, woodpeckerGlass, woodpeckerPerch]) {
            layer.dataset.ready = String(eligible);
          }
          if (!eligible) return null;

          const scale = Math.max(window.innerWidth / scenery.width, window.innerHeight / scenery.height);
          const birdSize = scale * scenery.birdSize;
          woodpeckerGutters.style.setProperty("--runner-left", `${runner.left}px`);
          woodpeckerGutters.style.setProperty("--runner-right", `${runner.right}px`);
          woodpeckerGutters.style.setProperty("--woodpecker-size", `${birdSize}px`);
          woodpeckerGlass.style.left = `${runner.left}px`;
          woodpeckerGlass.style.width = `${runner.width}px`;
          woodpeckerGlass.style.setProperty("--woodpecker-size", `${birdSize}px`);
          return { runner };
        };

        const showFlightFrame = (frame) => {
          for (const bird of [flightBird, glassBird]) {
            bird.style.backgroundImage = "var(--acorn-woodpecker-flight)";
            bird.style.backgroundSize = "500% 100%";
            bird.style.backgroundPosition = `${frame * 25}% 0`;
          }
        };

        const perch = () => {
          if (!layoutGutters()) return;
          woodpeckerGutters.dataset.state = "perched";
          woodpeckerGlass.dataset.state = "idle";
          woodpeckerPerch.dataset.state = "perched";
        };

        const dimensions = layoutGutters();
        if (dimensions) {
          if (reduceWoodpeckerMotion || !isHome) {
            perch();
          } else {
            window.setTimeout(() => {
              const startedAt = performance.now();
              const duration = 3200;
              woodpeckerGutters.dataset.state = "flying";
              woodpeckerGlass.dataset.state = "flying";
              woodpeckerPerch.dataset.state = "idle";

              const fly = (now) => {
                const gutters = layoutGutters();
                if (!gutters) return;
                const elapsed = Math.min(now - startedAt, duration);
                const progress = elapsed / duration;
                const scale = Math.max(window.innerWidth / scenery.width, window.innerHeight / scenery.height);
                const offsetX = (window.innerWidth - (scenery.width * scale)) / 2;
                const offsetY = (window.innerHeight - (scenery.height * scale)) / 2;
                const perchX = offsetX + (scenery.trunkX * scale);
                const perchY = offsetY + (scenery.trunkY * scale);
                const x = window.innerWidth + ((perchX - window.innerWidth) * progress);
                const y = (window.innerHeight * 0.19) + ((perchY - (window.innerHeight * 0.19)) * progress);
                showFlightFrame(flightFrames[Math.floor(elapsed / 90) % flightFrames.length]);
                flightBird.style.top = `${y}px`;
                flightBird.style.transform = `translate3d(${x}px, 0, 0)`;
                glassBird.style.top = `${y}px`;
                glassBird.style.transform = `translate3d(${x - gutters.runner.left}px, 0, 0)`;

                if (elapsed < duration) {
                  window.requestAnimationFrame(fly);
                } else {
                  flightComplete = true;
                  perch();
                }
              };
              window.requestAnimationFrame(fly);
            }, 1200);
          }
        }

        window.addEventListener("resize", () => {
          if (flightComplete) perch();
        }, { passive: true });
      }

      const menuToggle = document.getElementById("mobile-menu-toggle");
      const menu = document.getElementById("mobile-navigation");
      if (menuToggle && menu) {
        const setMenuOpen = (open) => {
          menu.classList.toggle("is-open", open);
          menuToggle.setAttribute("aria-expanded", String(open));
        };
        setMenuOpen(false);
        menuToggle.addEventListener("click", () => {
          setMenuOpen(!menu.classList.contains("is-open"));
        });
      }

      const updateThemeColor = () => {
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = getComputedStyle(document.body).backgroundColor;
      };
      const toggleAppearance = () => {
        root.classList.toggle("dark");
        const appearance = root.classList.contains("dark") ? "dark" : "light";
        try {
          localStorage.setItem("appearance", appearance);
        } catch {
          // Appearance still changes when browser storage cannot be written.
        }
        try {
          window.updateMeta?.();
        } catch {
          updateThemeColor();
        }
        try {
          window.updateMermaidTheme?.();
        } catch {
          // Mermaid is optional and must not block the appearance control.
        }
        try {
          window.updateLogo?.(appearance);
        } catch {
          // Secondary logo support is optional.
        }
      };
      const clearAppearance = () => {
        try {
          localStorage.removeItem("appearance");
        } catch {
          // Storage is optional for this control.
        }
      };

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (const day of document.querySelectorAll(".field-log-day:not(.field-log-day-empty)")) {
        let reset;
        let trail;
        const reveal = () => {
          window.clearTimeout(reset);
          day.classList.remove("is-revealing");
          // Restart the count-rise animation for repeated hover/focus.
          void day.offsetWidth;
          day.classList.add("is-revealing");
          reset = window.setTimeout(() => day.classList.remove("is-revealing"), 1500);
        };
        const markTrail = () => {
          if (reduceMotion) return;
          window.clearTimeout(trail);
          day.classList.remove("is-trailing");
          void day.offsetWidth;
          day.classList.add("is-trailing");
          trail = window.setTimeout(() => day.classList.remove("is-trailing"), 700);
        };
        day.addEventListener("pointerenter", () => { markTrail(); reveal(); });
        day.addEventListener("focus", reveal);
        day.addEventListener("pointerleave", () => {
          window.clearTimeout(reset);
          day.classList.remove("is-revealing");
        });
        day.addEventListener("blur", () => {
          window.clearTimeout(reset);
          day.classList.remove("is-revealing");
        });
      }

      for (const id of ["appearance-switcher", "appearance-switcher-mobile"]) {
        const switcher = document.getElementById(id);
        if (!switcher) continue;
        // Capture handlers replace Blowfish's unguarded localStorage handlers.
        switcher.addEventListener("click", (event) => {
          event.stopImmediatePropagation();
          toggleAppearance();
        }, true);
        switcher.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          clearAppearance();
        }, true);
      }
    });
  })();
</script>
